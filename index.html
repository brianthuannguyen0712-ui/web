<div id="app">

  </div>

</div>

let currentTopic = null;
let currentQ = 0;
let score = 0;
let answered = false;
let currentTab = 'vocab';

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome(){show('screen-home')}

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5)}

function renderTopics(){
  const g = document.getElementById('topic-grid');
  g.innerHTML = topics.map(t=>`
    <button class="topic-btn" onclick="openTopic('${t.id}')">
      <span class="icon">${t.icon}</span>
      ${t.name}<br>
      <span style="font-size:10px;opacity:.6">${t.sub}</span>
    </button>`).join('');
}

function openTopic(id){
  currentTopic = topics.find(t=>t.id===id);
  document.getElementById('topic-title').textContent = currentTopic.icon+' '+currentTopic.name;
  document.getElementById('topic-sub').textContent = currentTopic.sub;
  switchTab('vocab', document.querySelectorAll('.tab')[0]);
  show('screen-topic');
}

function switchTab(tab, btn){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-vocab').style.display = tab==='vocab'?'block':'none';
  document.getElementById('tab-quiz').style.display = tab==='quiz'?'block':'none';
  if(tab==='vocab') renderVocab();
  else startQuiz();
}

let flipped = {};
function renderVocab(){
  flipped = {};
  const g = document.getElementById('vocab-grid');
  g.innerHTML = currentTopic.vocab.map((v,i)=>`
    <div class="vocab-card" id="vc${i}" onclick="flipCard(${i})">
      <div class="word">${v.w}</div>
      <div class="pron">${v.p}</div>
      <div class="def">${v.d}</div>
    </div>`).join('');
}

function flipCard(i){
  const v = currentTopic.vocab[i];
  const card = document.getElementById('vc'+i);
  flipped[i] = !flipped[i];
  if(flipped[i]){
    card.classList.add('flipped');
    card.innerHTML = `<div class="word">${v.d}</div><div class="pron" style="opacity:.5">nhấn để lật lại</div><div class="def">${v.w}</div>`;
  } else {
    card.classList.remove('flipped');
    card.innerHTML = `<div class="word">${v.w}</div><div class="pron">${v.p}</div><div class="def">${v.d}</div>`;
  }
}

function startQuiz(){
  currentQ = 0; score = 0; answered = false;
  renderQuestion();
}

function renderQuestion(){
  const qs = currentTopic.questions;
  if(currentQ >= qs.length){ showResult(); return; }
  const q = qs[currentQ];
  const total = qs.length;
  document.getElementById('q-count').textContent = `Câu ${currentQ+1} / ${total}`;
  document.getElementById('progress-fill').style.width = (currentQ/total*100)+'%';
  const opts = shuffle(q.opts);
  document.getElementById('quiz-area').innerHTML = `
    <div class="question-box">
      <div class="q-label">Câu hỏi ${currentQ+1}</div>
      <div class="q-text">${q.q}</div>
    </div>
    <div class="options">
      ${opts.map(o=>`<button class="opt-btn" onclick="answer(this,'${o}','${q.ans}')">${o}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="next-btn" onclick="nextQ()">Tiếp theo →</button>
  `;
  answered = false;
}

function answer(btn, chosen, correct){
  if(answered) return;
  answered = true;
  const fb = document.getElementById('feedback');
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(chosen===correct){
    btn.classList.add('correct');
    fb.textContent = '✓ Đúng rồi!'; fb.className='feedback ok';
    score++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '✗ Sai! Đáp án: '+correct; fb.className='feedback no';
    document.querySelectorAll('.opt-btn').forEach(b=>{
      if(b.textContent.trim()===correct) b.classList.add('correct');
    });
  }
  document.getElementById('next-btn').style.display='block';
}

function nextQ(){
  currentQ++;
  renderQuestion();
}

function showResult(){
  const total = currentTopic.questions.length;
  const pct = Math.round(score/total*100);
  let star='⭐', msg='';
  if(pct===100){star='🏆';msg='Hoàn hảo! Bạn thật xuất sắc!';}
  else if(pct>=80){star='🌟';msg='Rất tốt! Tiếp tục cố gắng nhé!';}
  else if(pct>=60){star='👍';msg='Khá tốt! Ôn thêm một chút nhé!';}
  else{star='💪';msg='Cần cố gắng thêm! Đừng bỏ cuộc!';}
  document.getElementById('result-star').textContent=star;
  document.getElementById('result-score').textContent=score+'/'+total;
  document.getElementById('result-label').textContent=msg+' ('+pct+'%)';
  show('screen-result');
}

function restartQuiz(){
  show('screen-topic');
  const quizTab = document.querySelectorAll('.tab')[1];
  switchTab('quiz', quizTab);
}

renderTopics();
</script>

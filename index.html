<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root { --p: #38bdf8; --bg: #0f172a; --glass: rgba(56, 189, 248, 0.1); }
    * { box-sizing: border-box; font-family: 'Comfortaa', cursive; }
    body { margin: 0; background: var(--bg); color: white; padding: 20px; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 850px; background: rgba(255,255,255,0.03); border: 1px solid rgba(56,189,248,0.2); border-radius: 35px; padding: 35px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .topic-box { background: var(--glass); padding: 25px; border-radius: 20px; margin-bottom: 25px; border: 1px dashed var(--p); min-height: 120px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 19px; line-height: 1.5; color: #f1f5f9; }
    .mic-btn { width: 85px; height: 85px; border-radius: 50%; background: var(--p); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; margin: 0 auto 15px; }
    .mic-btn.rec { background: #ef4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    .transcript { width: 100%; min-height: 160px; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 20px; color: #cbd5e1; margin-bottom: 25px; text-align: left; line-height: 1.8; border: 1px solid rgba(255,255,255,0.05); font-size: 15px; }
    .score-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 30px; }
    .score-box { background: rgba(255,255,255,0.05); padding: 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
    .score-val { color: var(--p); font-size: 26px; font-weight: 700; display: block; }
    .btn { padding: 20px 40px; border-radius: 50px; border: none; font-weight: 700; cursor: pointer; background: var(--p); color: #0f172a; font-size: 16px; transition: 0.4s; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2); }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4); filter: brightness(1.1); }
</style>
</head>
<body>

<div class="card">
    <div style="font-size: 12px; letter-spacing: 3px; color: var(--p); margin-bottom: 12px; font-weight: 700; text-transform: uppercase;">IELTS Vocabulary Training</div>
    <div class="topic-box" id="topic">Nhấn nút bên dưới để bắt đầu thử thách Speaking...</div>
    
    <div class="mic-section">
        <button id="mic-btn" class="mic-btn">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </button>
        <p id="status" style="font-size: 14px; color: var(--p); font-weight: 600;">Sẵn sàng</p>
    </div>

    <div class="transcript" id="transcript">Văn bản bài nói của bạn sẽ xuất hiện tại đây...</div>

    <div class="score-row">
        <div class="score-box"><span class="score-val" id="f-score">0.0</span><span style="font-size: 11px; opacity: 0.6; text-transform: uppercase;">Fluency</span></div>
        <div class="score-box"><span class="score-val" id="o-score">0.0</span><span style="font-size: 11px; opacity: 0.6; text-transform: uppercase;">Overall Band</span></div>
    </div>

    <button class="btn" onclick="newTopic()">🎲 Get 15 New Topics</button>
</div>

<script>
    // Danh sách 15 Topic mở rộng cho trình độ B1/IELTS
    const topics = [
        "1. TRANSPORTATION: What is the most popular means of transport in your city?",
        "2. MEDIA: How do you usually get your news? (Newspapers, TV, or Social Media?)",
        "3. CRIME: What do you think is the best way to reduce crime in big cities?",
        "4. ADVERTISING: Do you think advertisements have a big influence on what you buy?",
        "5. ART: Do you enjoy visiting art galleries or museums? Why?",
        "6. ARCHITECTURE: Describe a famous building in your country that you like.",
        "7. FESTIVALS: What is the most important festival in your country?",
        "8. SPORTS: Do you prefer watching sports or playing them?",
        "9. LIFESTYLE: Would you rather live in a big city or a quiet countryside?",
        "10. ANIMALS: Should animals be kept in zoos? Why or why not?",
        "11. SPACE: Do you think it is important for humans to explore space?",
        "12. SOCIAL MEDIA: What are the pros and cons of using social media?",
        "13. RELATIONSHIPS: What qualities do you look for in a good friend?",
        "14. READING: Do you prefer reading physical books or e-books?",
        "15. AMBITIONS: What is your dream job and why do you want to do it?"
    ];

    let recognition;
    let isRec = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let text = "";
            for (let i = e.resultIndex; i < e.results.length; ++i) {
                text += e.results[i][0].transcript;
            }
            document.getElementById('transcript').innerText = text;
            let words = text.trim().split(/\s+/).length;
            if(words > 2) {
                let score = Math.min(9.0, (words / 50) * 7.5 + 1).toFixed(1);
                document.getElementById('f-score').innerText = score;
                document.getElementById('o-score').innerText = score;
            }
        };
    }

    document.getElementById('mic-btn').onclick = () => {
        if (!isRec) {
            recognition.start();
            isRec = true;
            document.getElementById('mic-btn').classList.add('rec');
            document.getElementById('status').innerText = "Đang thu âm... Hãy nói tiếng Anh!";
        } else {
            recognition.stop();
            isRec = false;
            document.getElementById('mic-btn').classList.remove('rec');
            document.getElementById('status').innerText = "Đã ghi nhận bài nói.";
        }
    };

    function newTopic() {
        const idx = Math.floor(Math.random() * topics.length);
        document.getElementById('topic').innerText = topics[idx];
        document.getElementById('transcript').innerText = "Chờ bài nói mới...";
        document.getElementById('f-score').innerText = "0.0";
        document.getElementById('o-score').innerText = "0.0";
        document.getElementById('status').innerText = "Sẵn sàng";
    }
</script>
</body>
</html>
